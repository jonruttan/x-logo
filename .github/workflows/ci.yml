name: CI

# The matrix runs two x-lang refs: the release this bundle declares in
# lang.xon (requires-release ...) and current main. The pinned leg proves the
# bundle still runs on the platform it declares; the main leg is an early
# warning that x-lang has moved underneath it, and is allowed to fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the interesting failure here is one nothing in this
  # repository triggers: x-lang moving while this bundle sits still.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # The pinned matrix leg is derived from lang.xon, not written here, so there
  # is no second copy to keep in sync.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      declared: ${{ steps.legs.outputs.declared }}
    steps:
      - uses: actions/checkout@v4
      - id: legs
        name: Read the declared release from lang.xon
        run: |
          declared=$(sed -n 's/^(requires-release "\(.*\)")$/\1/p' lang.xon)
          if [ -z "$declared" ]; then
            echo "lang.xon declares no (requires-release ...)" >&2
            exit 1
          fi
          echo "declared=$declared" >> "$GITHUB_OUTPUT"
          echo "legs=[\"$declared\", \"main\"]" >> "$GITHUB_OUTPUT"
          echo "matrix: $declared and main"

  specs:
    needs: prepare
    name: specs @ x-lang ${{ matrix.x-lang }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.x-lang == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        # Both legs answer different questions: the pinned leg proves this
        # bundle still runs on the platform it declares; the main leg is an
        # early warning that x-lang has moved underneath it, and is allowed to
        # fail. The pinned row comes from lang.xon.
        x-lang: ${{ fromJSON(needs.prepare.outputs.legs) }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: x-logo

      - name: Check out x-lang
        uses: actions/checkout@v4
        with:
          repository: jonruttan/x-lang
          ref: ${{ matrix.x-lang }}
          path: .x-lang

      # The engine is acquired, not built: x-lang pins one and knows how to
      # fetch it.  Nothing here reimplements that.
      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine      # acquire the pinned engine
          make             # x-bin at the repo root -- `make engine` does not build it
          make boot        # the launcher-free amalgams the harness loads

      # One spec file, and a heavy one: the turtle kernel's resident heap is
      # 5-7GB (x-lang's @weight 7 row), so it runs alone rather than beside the
      # other jobs -- a swapping machine reports failures that are not there.
      - name: Run the turtle specs
        working-directory: x-logo
        run: X="$GITHUB_WORKSPACE/.x-lang/x.sh" sh tests/spec-runner.sh

      # End to end, which the specs deliberately are not: an example goes
      # through the indentation preprocessor, the tokenizer, the infix parser,
      # the dispatcher and the batch launcher.
      - name: Run the examples
        working-directory: x-logo
        run: X="$GITHUB_WORKSPACE/.x-lang/x.sh" sh tests/examples.sh

  # The platform's linter, over this bundle's sources.  It reads every file as
  # text, including the branches no spec reaches.
  #
  # Both legs run, on the same split as `specs`.  The pinned leg skips while
  # the release lang.xon names carries no kit linter: tests/lint.sh says so on
  # stderr and exits 0, and the gate goes live when (requires-release ...)
  # moves to an x that ships one.  The main leg is allowed to fail, as an
  # early warning that a rule started firing because the platform moved.
  lint:
    needs: prepare
    name: lint @ x-lang ${{ matrix.x-lang }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.x-lang == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        x-lang: ${{ fromJSON(needs.prepare.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: x-logo

      - name: Check out x-lang
        uses: actions/checkout@v4
        with:
          repository: jonruttan/x-lang
          ref: ${{ matrix.x-lang }}
          path: .x-lang

      # `make boot` is required: the linter loads the boot amalgam, and its
      # fallback library opens with a root-relative include that cannot
      # resolve from this job's working directory.
      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine
          make
          make boot

      - name: Lint the bundle
        working-directory: x-logo
        run: X="$GITHUB_WORKSPACE/.x-lang/x.sh" sh tests/lint.sh

  # The pty contract, on both OSes: ctrl-c cancel, the exit paths, and the
  # execute-once ruling are all isatty-guarded, so the batch-driven suites
  # above are blind to them. Its own job because it needs a real terminal, and
  # its own OS matrix because the pty and signal behaviour differs between
  # platforms.
  tty:
    needs: prepare
    name: tty contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: x-logo
      - name: Check out x-lang
        uses: actions/checkout@v4
        with:
          repository: jonruttan/x-lang
          ref: ${{ needs.prepare.outputs.declared }}
          path: .x-lang
      - name: Install expect
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y expect
          else
            brew list expect >/dev/null 2>&1 || brew install expect
          fi
      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine
          make
      - name: Run the tty contract
        working-directory: x-logo
        run: X="$GITHUB_WORKSPACE/.x-lang/x.sh" sh tests/tty-runner.sh

  relocatable:
    # Gate: a bundle needs no root-relative path literal, not even in run.x
    # (x.sh boots the dialect and arms this root before run.x is read). One
    # would nail the bundle to the directory it was written in, and the
    # symptom only appears once someone moves it.
    name: no path literals at all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The kit ships with the platform, so this job needs x-lang present -- a
      # shallow checkout of the release lang.xon declares, not a build. The
      # check reads lang.xon and greps the tree, so X_LANG_KIT points straight
      # at the kit rather than going through `x --share-dir`.
      - name: Check out the lang kit
        run: |
          declared=$(sed -n 's/^(requires-release "\(.*\)")$/\1/p' lang.xon)
          git clone --depth 1 --branch "$declared" \
            https://github.com/jonruttan/x-lang.git .x-lang

      - name: The declared versions are named once
        env:
          X_LANG_KIT: ${{ github.workspace }}/.x-lang/tools/lang-kit
        run: sh tools/check/release-refs.sh

      - name: No path literals outside run.x
        run: |
          # Ignore comments -- a file may quote a literal it does not use.
          # Exclude the platform clone: x-lang's own boot files use root-
          # relative includes legitimately, and this gate asks only whether
          # THIS bundle relocates.
          hits=$(grep -rn '(include "[a-zA-Z]' --include='*.x' \
                 --exclude-dir='.x-lang' . \
                 | grep -Ev ':[0-9]+:[[:space:]]*;' || true)
          if [ -n "$hits" ]; then
            echo "root-relative include (a bundle needs none, not even in run.x):" >&2
            echo "$hits" >&2
            exit 1
          fi

      # %lang-root OR NOTHING.  This bundle is the first that ships DATA --
      # logo/viewer.html, read at runtime and handed to a browser -- and the
      # ways of finding it that LOOK fine in a checkout are the ways that
      # broke it in every installed tree: a bare cwd-relative literal, or a
      # path joined onto %install-root, which points at the PLATFORM's tree
      # rather than this one.  The seam row exists so there is a right answer;
      # this asserts nobody quietly went back to a wrong one.
      - name: Data paths go through %lang-root
        run: |
          hits=$(grep -rn '%install-root' --include='*.x' \
                 --exclude-dir='.x-lang' . \
                 | grep -Ev ':[0-9]+:[[:space:]]*;' || true)
          if [ -n "$hits" ]; then
            echo "a bundle's data lives under %lang-root, not %install-root:" >&2
            echo "$hits" >&2
            exit 1
          fi

      - name: The generated harness is not committed
        run: |
          if [ -e tests/lib/harness.gen.x ]; then
            echo "tests/lib/harness.gen.x is generated and machine-specific;" >&2
            echo "it must not be committed (see .gitignore)" >&2
            exit 1
          fi
