name: Release

# A TAG PUBLISHES A BUNDLE.  x-lang's Pin bundle fetches a tarball by URL and
# verifies it against a sha256 the consumer's lang.pin.xon carries, so a
# release is exactly two artifacts: the tarball, and the digest of it.
#
# THE SUITE RUNS FIRST.  A tag on a red tree publishes nothing -- the same
# ruling x-lang's own release workflow follows.  A bundle whose specs fail is
# not a release, it is a trap with a digest on it.
#
# RED MEANS RED HERE, and that is a statement about this bundle rather than a
# style.  Three of the six langs carry a tests/contract/known-failures.txt and
# gate against the failing test NAMES, because they ship documented debt and a
# bare pass/fail count would make them permanently red.  Logo has none: the
# turtle suite is 0 failures, and a suite with nothing to excuse wants the
# runner's own verdict, not a list to compare against.
#
# If that ever stops being true, the answer is to fix it or to record it --
# adding a ratchet file and the gate that reads it is the second of those, and
# it should be a deliberate act with a reason written beside it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to roll (dry run -- publishes nothing)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tools/bundle.sh archives FROM a tag

      - name: Check out the x-lang this bundle declares
        run: |
          declared=$(sed -n 's/^(requires-release "\(.*\)")$/\1/p' lang.xon)
          echo "lang.xon declares $declared"
          git clone --depth 1 --branch "$declared" \
            https://github.com/jonruttan/x-lang.git .x-lang

      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine      # acquire the pinned engine
          make             # x-bin at the repo root -- `make engine` does not build it
          make boot        # the launcher-free amalgams the harness loads

      # THE GATE, not a formality: this is the last point at which a bad
      # bundle can be stopped from acquiring a digest and a URL.  The examples
      # run too -- they are the only thing here that exercises the reader, the
      # parser and the dispatcher end to end.
      - name: Run the turtle specs
        run: X="$PWD/.x-lang/x.sh" sh tests/spec-runner.sh

      - name: Run the examples
        run: X="$PWD/.x-lang/x.sh" sh tests/examples.sh

      - name: Roll the bundle
        id: roll
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          sh tools/bundle.sh "$TAG" dist | tee roll.out
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The pin a consumer needs, in the release notes rather than in a wiki
      # that drifts: the digest is only useful next to the URL it belongs to.
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.roll.outputs.tag }}"
          {
            echo '## Install'
            echo
            echo '```sh'
            echo "x --install-lang https://github.com/jonruttan/x-logo/releases/download/$TAG/lang.pin.xon"
            echo '```'
            echo
            echo '## Or pin it, for a project'
            echo
            echo 'Put this in the project'"'"'s `lang.pin.xon`:'
            echo
            echo '```x'
            sed -n '/^  (lang /,$p' roll.out | sed 's/^  //'
            echo '```'
          } > notes.md
          gh release create "$TAG" \
            --title "x-logo $TAG" \
            --notes-file notes.md \
            "dist/x-logo-$TAG.tar.gz" \
            "dist/x-logo-$TAG.tar.gz.sha256" \
            "dist/lang.pin.xon"
